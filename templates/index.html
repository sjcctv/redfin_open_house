<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redfin Open House Scraper</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>
th.sorted::after { content: " ↑"; }
#progressBarContainer {
    height: 20px;
    background: #e9ecef;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 6px;
}
#progressBar {
    height: 100%;
    width: 0%;
    background-color: #0d6efd;
    transition: width 0.5s;
}
#warningText {
    color: #d9534f;
    font-weight: bold;
    margin-top: 8px;
}
</style>
</head>
<body class="p-4">
<h1>Redfin Open House Scraper</h1>
<div class="mb-3">
    <input type="text" id="address" class="form-control" placeholder="Enter target zipcode or address">
    <button id="scrapeBtn" class="btn btn-primary mt-2">Start Scrape</button>
    <div id="progressText" class="mt-2 text-info fw-bold">Waiting to start...</div>
    <div id="progressBarContainer"><div id="progressBar"></div></div>
    <div id="warningText"></div>
</div>

<table class="table table-striped" id="resultTable">
<thead>
<tr>
<th>Address</th>
<th>Price</th>
<th>Beds</th>
<th>Baths</th>
<th>Sqft</th>
<th>Lot</th>
<th>Garage</th>
<th>Walk Score</th>
<th>Open House</th>
<th class="sorted">Distance (mile)</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
let polling;

document.getElementById('scrapeBtn').onclick = async () => {
    const btn = document.getElementById('scrapeBtn');
    btn.disabled = true;
    btn.innerText = "Scraping...";
    const address = document.getElementById('address').value;
    document.getElementById('progressText').innerText = "Starting...";
    document.getElementById('progressBar').style.width = "0%";
    document.getElementById('warningText').innerText = "";

    // --- live polling for scraping progress ---
    polling = setInterval(async () => {
        const res = await fetch('/progress');
        const data = await res.json();
        const page = data.page || 0;
        const total = data.total_cards || 'Calculating...';
        const scraped = data.scraped_cards || 'Calculating...';
        const percent = total > 0 ? Math.round((scraped / total) * 100) : 0;
        document.getElementById('progressText').innerText =
            `Page: ${page} | Total cards: ${total} | Scraped: ${scraped}`;
        document.getElementById('progressBar').style.width = percent + "%";
    }, 1000);

    // --- start scraping request ---
    const res = await fetch('/start_scrape', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({target_address: address})
    });

    clearInterval(polling);
    const data = await res.json();
    const tbody = document.querySelector('#resultTable tbody');
    tbody.innerHTML = '';

    if (data.error) {
        alert("Error: " + data.error);
    } else {
        // unpack backend structure
        const results = data.results || data;  // fallback if backend still returns list
        const hasLocation = data.has_location !== undefined ? data.has_location : true;

        // show warning if location not found
        if (!hasLocation) {
            document.getElementById('warningText').innerText =
                "⚠️ Unable to locate the address — distance will not be rendered.";
        }

        results.sort((a,b) => {
            const da = parseFloat(a.distance_mile) || Infinity;
            const db = parseFloat(b.distance_mile) || Infinity;
            return da - db;
        });

        results.forEach(item => {
            const row = `<tr>
                <td>${item.address}</td>
                <td>${item.price}</td>
                <td>${item.beds}</td>
                <td>${item.baths}</td>
                <td>${item.sqft}</td>
                <td>${item.lot}</td>
                <td>${item.garage}</td>
                <td>${item.walk_score}</td>
                <td>${item.open_house}</td>
                <td>${hasLocation ? item.distance_mile : '-'}</td>
            </tr>`;
            tbody.innerHTML += row;
        });

        document.getElementById('progressText').innerText =
            "✅ Scraping complete! (Sorted by Distance ↑)";
        document.getElementById('progressBar').style.width = "100%";
    }

    btn.disabled = false;
    btn.innerText = "Start Scrape";
};
</script>
</body>
</html>
