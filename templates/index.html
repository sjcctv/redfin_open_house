<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redfin Open House Scraper</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<style>th.sorted::after { content: " ↑"; }</style>
</head>
<body class="p-4">
<h1>Redfin Open House Scraper</h1>
<div class="mb-3">
<input type="text" id="address" class="form-control" placeholder="Enter target zipcode">
<button id="scrapeBtn" class="btn btn-primary mt-2">Start Scrape</button>
<div id="progressText" class="mt-2 text-info"></div>
</div>
<table class="table table-striped" id="resultTable">
<thead>
<tr>
<th>Address</th>
<th>Price</th>
<th>Beds</th>
<th>Baths</th>
<th>Sqft</th>
<th>Lot</th>
<th>Garage</th>
<th>Walk Score</th>
<th>Open House</th>
<th class="sorted">Distance (mile)</th>
</tr>
</thead>
<tbody></tbody>
</table>
<script>
let polling;
document.getElementById('scrapeBtn').onclick=async()=>{
    const btn=document.getElementById('scrapeBtn');
    btn.disabled=true; btn.innerText="Scraping...";
    const address=document.getElementById('address').value;
    document.getElementById('progressText').innerText="Starting...";
    polling=setInterval(async()=>{
        const res=await fetch('/progress');
        const data=await res.json();
        document.getElementById('progressText').innerText="Scraping page: "+data.page;
    },1000);
    const res=await fetch('/start_scrape',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({target_address:address})
    });
    clearInterval(polling);
    const data=await res.json();
    const tbody=document.querySelector('#resultTable tbody'); 
    tbody.innerHTML='';
    if(data.error){ alert("Error: "+data.error); } 
    else {
        data.sort((a,b)=>{const da=parseFloat(a.distance_mile)||Infinity; const db=parseFloat(b.distance_mile)||Infinity; return da-db;});
        data.forEach(item=>{
            const row=`<tr>
                <td>${item.address}</td>
                <td>${item.price}</td>
                <td>${item.beds}</td>
                <td>${item.baths}</td>
                <td>${item.sqft}</td>
                <td>${item.lot}</td>
                <td>${item.garage}</td>
                <td>${item.walk_score}</td>
                <td>${item.open_house}</td>
                <td>${item.distance_mile}</td>
            </tr>`;
            tbody.innerHTML+=row;
        });
        document.getElementById('progressText').innerText="Scraping complete! (Sorted by Distance ↑)";
    }
    btn.disabled=false; btn.innerText="Start Scrape";
}
</script>
</body>

</html>
